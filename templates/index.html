<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Research Explorer</title>
    <link rel="stylesheet" href="/static/style.css">
    <script type="module" src="/static/app.js"></script>
</head>
<body>
    <header id="header">
        <div class="header-group">

        </div>



        <div class="header-group time-group">
            <span class="header-label">Timeline:</span>
            <input id="yearStart" class="header-number-input" type="number" min="1960" max="2026" value="1960" oninput="applyGlobalFilters()">
            <span class="range-dash">—</span>
            <input id="yearEnd" class="header-number-input" type="number" min="1960" max="2026" value="2026" oninput="applyGlobalFilters()">
        </div>

        <div class="header-divider"></div>






<!-- Add this near your plotOptionsBtn in the header -->
<button id="datasetOptionsBtn" class="select-button-labeled" aria-label="Dataset Options" title="Select Datasets">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
        <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
        <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
    </svg>
    <span>Datasets</span>
</button>
<div class="header-divider"></div>




<button id="plotOptionsBtn" class="select-button-labeled" aria-label="Plot Options" title="Configure Plot Settings">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="3" y1="9" x2="21" y2="9"></line>
                <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            <span>Plot</span>
        </button>





   <div class="header-divider"></div>

<div class="view-toggle-group">
    <!-- Scatter View -->
<!-- Scatter View -->
<button id="btnToggleScatter" onclick="triggerScatterMode(); this.parentElement.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active')); this.classList.add('active');" class="group-btn scatter-btn">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="2" stroke-width="2"></circle>
        <circle cx="6" cy="18" r="2" stroke-width="2"></circle>
        <circle cx="18" cy="6" r="2" stroke-width="2"></circle>
        <circle cx="9" cy="8" r="2" stroke-width="2"></circle>
        <circle cx="15" cy="16" r="2" stroke-width="2"></circle>
    </svg>
    <span>Scatter</span>
</button>

    <!-- Hierarchy View (DEFAULT ACTIVE) -->
    <button id="btnToggleHierarchy" onclick="window.toggleHierarchyView(); this.parentElement.querySelectorAll('.group-btn').forEach(b => b.classList.remove('active')); this.classList.add('active');" class="group-btn hierarchy-btn active">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <rect x="10" y="3" width="4" height="4" rx="1" stroke-width="2"></rect>
            <rect x="3" y="17" width="4" height="4" rx="1" stroke-width="2"></rect>
            <rect x="17" y="17" width="4" height="4" rx="1" stroke-width="2"></rect>
            <path d="M12 7v4" stroke-width="2" stroke-linecap="round"></path>
            <path d="M12 11h7v6" stroke-width="2" stroke-linejoin="round"></path>
            <path d="M12 11H5v6" stroke-width="2" stroke-linejoin="round"></path>
        </svg>
        <span>Hierarchy</span>
    </button>


</div>




<button id="btnToggleGraph" onclick="triggerNetworkGraphMode()" class="select-button-labeled" style="background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; margin-left: 8px !important;">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="18" cy="5" r="3" stroke-width="2"></circle>
        <circle cx="6" cy="12" r="3" stroke-width="2"></circle>
        <circle cx="18" cy="19" r="3" stroke-width="2"></circle>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke-width="2"></line>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke-width="2"></line>
    </svg>
    <span>Network</span>
</button>



<!-- Drop Pin -->


<div class="header-divider"></div>
<button id="pinToggleBtn" class="select-button-labeled" aria-label="Location pin" title="Drop Pin" onclick="armPinMode()">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <!-- Outer teardrop pin outline -->
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"></path>
        <!-- Inner circle outline -->
        <circle cx="12" cy="9" r="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></circle>
    </svg>
    <span>Pin</span>
</button>
<!-- Enable Islands Mode -->
<button id="islandToggleBtn" class="select-button-labeled" onclick="toggleIslandMode()" title="Toggle Islands Mode">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="6" cy="6" r="3" stroke-width="2"></circle>
        <circle cx="18" cy="8" r="3.5" stroke-width="2"></circle>
        <circle cx="10" cy="17" r="4" stroke-width="2"></circle>
    </svg>
    <span>Islands</span>
</button>

<!-- Enable Relevance Spiral -->
<button id="spiralToggleBtn" class="select-button-labeled" onclick="toggleSpiralMode()" title="Toggle Relevance Spiral">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke-width="2"></circle>
        <circle cx="12" cy="12" r="5" stroke-width="2"></circle>
        <circle cx="12" cy="12" r="1" stroke-width="2" fill="currentColor"></circle>
    </svg>
    <span>Spiral</span>
</button>

<!-- Toggle Heatmap -->
<button id="heatmapToggleBtn" title="Toggle Heatmap" class="select-button-labeled" aria-label="Toggle Heatmap" onclick="toggleHeatmap()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" opacity="0.3"/>
        <path d="M12 17C14.7614 17 17 14.7614 17 12C17 9.23858 14.7614 7 12 7C9.23858 7 7 9.23858 7 12C7 14.7614 9.23858 17 12 17Z"/>
    </svg>
    <span>Heatmap</span>
</button>






        <div class="header-group tools-group">














            <div class="header-divider"></div>
<button class="select-button" aria-label="Save Layout" title="Save Layout to File" onclick="window.exportLayout()">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
    </svg>
</button>

<!-- Load Layout Button (Triggers a hidden file input) -->
<input type="file" id="layoutFileInput" accept=".json" style="display: none;" onchange="window.importLayout(event)">
<button class="select-button" aria-label="Load Layout" title="Load Saved Layout" onclick="document.getElementById('layoutFileInput').click()">
    <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
    </svg>
</button>
  <div class="header-divider"></div>
           <!-- Export Dropdown -->
<div class="export-dropdown-wrapper" style="position: relative; display: inline-block;">
    <button type="button" id="exportDropdownBtn" class="select-button-labeled" style="height: 28px; padding: 0 8px; font-size: 11px; margin: 0;" title="Export Plot Options">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Export</span>
        <svg style="width: 10px; height: 10px; margin-left: 2px; flex-shrink: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </button>

    <!-- Dropdown Menu Content -->
    <div id="exportDropdownMenu" class="export-dropdown-menu">
        <div id="btnExportPlot" class="export-dropdown-item">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span>Download Image (Plot)</span>
        </div>
        <div id="btnExportCSV" class="export-dropdown-item">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            <span>Export Data (CSV)</span>
        </div>
    </div>
</div>


        <div class="header-divider"></div>



            <!-- Undo Button -->
            <button onclick="undo()" class="select-button" title="Undo">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path>
                </svg>
            </button>

            <!-- Redo Button -->
            <button onclick="redo()" class="select-button" title="Redo">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"></path>
                </svg>
            </button>


            <button onclick="window.resetPlot()" class="select-button" title="Reset View">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="vertical-align: middle;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
    </svg>
</button>
        </div>
    </header>

    <div id="content">
        <aside id="sidebar">
            <h2> Semantic Tools</h2>

           <div class="unified-search-wrapper">
    <label for="unifiedSearch">Search</label>

    <div class="search-input-group">
        <input
            id="unifiedSearch"
            type="text"
            placeholder="Search semantics, titles, authors, instruments, journals..."
            onkeydown="handleUnifiedSearchKeydown(event)"
        >
        <button id="unifiedSearchBtn" class="styled-button" onclick="addSearchBadgeFromInput()">
            Search
        </button>
    </div>

    <!-- Active Search Badges Container -->
    <div id="searchBadgesContainer" class="badges-container"></div>
</div>






            <div class="menu-section" style="margin-bottom: 24px;">



        </aside>

        <main id="center-column" style="display: flex; flex-direction: column; flex: 1; min-width: 0;">
     <div id="plotOptionsDialog" class="plot-dialog" style="display: none;">
    <div class="plot-dialog-header" id="plotDialogHeader">
        <span>Plot Options</span>
        <button id="closePlotDialog" class="dialog-close-btn">✕</button>
    </div>
    <div class="plot-dialog-content">
        <label>Title: <input type="text" id="plotTitleInput" placeholder="Enter plot title"></label>
         <!-- After (Fixed) -->
<label style="flex-direction: row; align-items: center;">
    <input type="checkbox" id="plotPinCheckbox" checked> Show Pins
</label>
        <label style="flex-direction: row; align-items: center;">
            <input type="checkbox" id="plotBorderCheckbox"> Show Border
        </label>

        <!-- Fixed: Added the missing opening label tag below -->
        <label style="flex-direction: row; align-items: center;">
            <input type="checkbox" id="plotLinesCheckbox"> Show Gridlines
        </label>

        <label>x-Axis Name: <input type="text" id="plotXAxisInput" placeholder="X-axis label"></label>
        <label>y-Axis Name: <input type="text" id="plotYAxisInput" placeholder="Y-axis label"></label>
        <label>x Scale: <input type="number" id="plotXScaleInput" value="1" step="0.1" min="0.1"></label>
        <label>y Scale: <input type="number" id="plotYScaleInput" value="1" step="0.1" min="0.1"></label>
    </div>
</div>

<div id="datasetDialog" class="plot-dialog dataset-dialog-large" style="display: none; top: 70px; left: 100px;">
    <div class="plot-dialog-header" id="datasetDialogHeader">
        <span>Dataset Explorer</span>
        <button id="closeDatasetDialog" class="dialog-close-btn">✕</button>
    </div>

    <div class="dataset-dialog-body">
        <!-- Left Side: Checkbox List -->
        <div class="dataset-list-panel">
            <label class="dataset-panel-label">Available Datasets</label>
            <div id="datasetChecklist" class="dataset-checklist"></div>
        </div>

        <!-- Right Side: Details & Preview -->
        <div id="datasetDetailsPanel" class="dataset-details-panel">
            <div id="datasetDetailsPlaceholder" class="dataset-details-placeholder">
                <svg width="40" height="40" fill="none" stroke="#9ca3af" viewBox="0 0 24 24" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                <p>Click on a dataset to inspect its details and preview image.</p>
            </div>

            <div id="datasetDetailsContent" class="dataset-details-content" style="display: none;">
                <div class="dataset-image-container">
                    <img id="datasetPreviewImg" src="" alt="Dataset Preview" />
                </div>
                <h4 id="datasetDetailsTitle">Dataset Name</h4>

                <p id="datasetDetailsDesc">Description will appear here.</p>
            </div>
        </div>
    </div>
</div>


            <div id="floatingTagLegend"></div>
            <div id="advancedSearchContainer"></div>
            <div id="floatingLegend"></div>

            <div id="plot" style="flex: 1; position: relative;">
                <canvas id="canvas" width="800" height="600"></canvas>
                <div id="pinPopup" style="display: none; position: absolute; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); padding: 12px; z-index: 50; width: 220px;"></div>
            </div>

            <div id="bottom-panel" class="bottom-panel tray-collapsed"></div>

            <div id="bottom-panel-tabs" class="tray-tabs-container">
                <button id="tab-trajectory" class="tray-tab active-traj">Search Path</button>
                <button id="tab-pins" class="tray-tab">Dropped Pins</button>
            </div>
        </main>

      <aside id="metaPanel" class="panel-collapsed">
          <button id="metaPanelCollapseBtn" class="panel-collapsed" onclick="toggleMetaPanel()" aria-label="Toggle Panel">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
    </svg>
</button>

            <div id="info">
                <h2>Paper Details</h2>
                <p style="color: #6b7280; font-size: 13px;">Select a paper on the map to view its full details.</p>
            </div>

        </aside>
    </div>
</body>
</html>
